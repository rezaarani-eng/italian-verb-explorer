name: Build and deploy Italian verb site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build JSON data from Google Sheet
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL || vars.SHEET_CSV_URL }}
          THIRD_BLOCK_MOOD: ${{ vars.THIRD_BLOCK_MOOD }}
          THIRD_BLOCK_TENSE: ${{ vars.THIRD_BLOCK_TENSE }}
          FOURTH_BLOCK_MOOD: ${{ vars.FOURTH_BLOCK_MOOD }}
          FOURTH_BLOCK_TENSE: ${{ vars.FOURTH_BLOCK_TENSE }}
        run: python scripts/build_data.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
